name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint · PHPCS · PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: cs2pr
      - uses: ramsey/composer-install@v4
      - run: composer lint
      - run: vendor/bin/phpcs -q --report=checkstyle | cs2pr
      - run: composer stan -- --error-format=github

  tests:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.php == '8.3' && 'pcov' || 'none' }}
      - uses: ramsey/composer-install@v4
      - name: Run tests
        if: matrix.php != '8.3'
        run: composer test
      - name: Run tests with coverage
        if: matrix.php == '8.3'
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

  mutation:
    name: Mutation testing (Infection)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov
      - uses: ramsey/composer-install@v4
      - run: vendor/bin/infection --threads=max --no-progress --logger-github

  plugin-check:
    name: WordPress.org Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bin/build.sh
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/wp-dbase
          # Naming warnings ("wp" in the slug) are a known, accepted trade-off.
          exclude-checks: trademarks

  commitlint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs
